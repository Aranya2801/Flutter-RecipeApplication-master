name: flutter_recipe_app
description: "A production-grade, AI-powered Recipe Application with meal planning, nutrition tracking, and smart search capabilities."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Navigation
  go_router: ^13.2.4

  # Networking
  dio: ^5.4.3
  retrofit: ^4.1.0
  pretty_dio_logger: ^1.3.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3
  path_provider: ^2.1.3

  # UI Components
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  lottie: ^3.1.0
  fl_chart: ^0.67.0
  smooth_page_indicator: ^1.1.0
  flutter_rating_bar: ^4.0.1
  expandable: ^5.0.1
  percent_indicator: ^4.2.3
  animated_text_kit: ^4.2.2
  
  # Image
  image_picker: ^1.1.0
  flutter_image_compress: ^2.2.0

  # Search & Filtering
  fuse_dart: ^0.1.1
  
  # Notifications
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4

  # Permissions
  permission_handler: ^11.3.1

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.5
  share_plus: ^9.0.0
  connectivity_plus: ^6.0.3
  uuid: ^4.4.0
  collection: ^1.18.0
  dartz: ^0.10.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  logger: ^2.3.0

  # Dependency Injection
  get_it: ^7.7.0
  injectable: ^2.4.1

  # Typography
  google_fonts: ^6.2.1

  # Animations
  rive: ^0.13.8

  # Accessibility
  flutter_tts: ^4.0.2

  # Analytics (mock-ready)
  firebase_core: ^2.31.1
  firebase_analytics: ^10.10.5
  firebase_crashlytics: ^3.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  retrofit_generator: ^8.1.1
  hive_generator: ^2.0.1
  injectable_generator: ^2.6.1
  mocktail: ^1.0.3
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/data/

  fonts:
    - family: Playfair
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
